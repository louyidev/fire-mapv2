<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Suivi Incendies - Analyse des Foyers Thermiques (MapLibre)</title>

  <!-- MapLibre GL CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="incendies.css" />
  <link rel="icon" href="favicon-fire.png" />
</head>

<body>
  <div id="map"></div>

  <!-- Bandeau Relevé -->
  <div class="last-update-banner" id="last-update-banner" style="display: none">
    <span>🛰️ Statut Thermique :</span>
    <span class="time-badge" id="last-update-text">--/--/-- à --:--</span>
  </div>

  <!-- Carte d'information & Légende -->
  <div class="info-card">
    <h3>🇪🇺 Analyse des Foyers</h3>
    <div class="status-container">
      <div id="loader" class="spinner"></div>
      <div class="status-text" id="status">Initialisation...</div>
    </div>
    <button class="btn" id="btn-reload">Actualiser les flux</button>

    <div class="legend">
      <div class="legend-item"><span class="dot dot-active"></span> Actif (&lt;12h)</div>
      <div class="legend-item"><span class="dot dot-medium"></span> Atténué (12-36h)</div>
      <div class="legend-item"><span class="dot dot-old"></span> Ancien (&gt;36h)</div>
      <div class="map-view-selector">
        <label><input type="radio" name="map-view" id="view-gironde" value="gironde" checked /> 🔥 Gironde</label>
        <label><input type="radio" name="map-view" id="view-france" value="france" /> 🇫🇷 France</label>
      </div>
    </div>
    <div id="aircraft-filter-panel" class="control-group">
      <h3>Filtres Aéronefs</h3>
      <div class="filter-options">
        <div>
          <label class="filter-checkbox">
            <input type="checkbox" id="filter-emergency" checked />
            <span class="badge badge-emergency">🚨 Secours</span>
          </label>
        </div>
        <div>
          <label class="filter-checkbox">
            <input type="checkbox" id="filter-commercial" />
            <span class="badge badge-commercial">✈️ Général</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Terminal API Logs -->
  <div class="terminal-log" id="terminal-log" style="display: none"></div>

  <!-- PANNEAU DES CONTRÔLES COMPACTS (VENT & FEUX) -->
  <div class="map-controls-panel">

    <!-- Slider Vent -->
    <div id="wind-controls" class="control-card wind-card">
      <div class="control-row">
        <button id="wind-play-btn" class="btn-play wind-btn" aria-label="Animer le vent">▶</button>
        <div class="slider-wrapper">
          <div class="slider-info">
            <span class="control-title">🌬️ Vent</span>
            <strong id="wind-hour-value" class="badge wind-badge">--/--/-- --:--</strong>
          </div>
          <input type="range" id="wind-slider" min="0" max="167" value="0" step="1">
        </div>
      </div>
    </div>

    <!-- Slider Historique Feux -->
    <div class="timeline-card control-card fire-card" id="timeline-panel" style="display: none">
      <div class="control-row">
        <button class="btn-play fire-btn" id="btn-play" aria-label="Animer la chronologie">▶</button>
        <div class="slider-wrapper">
          <div class="slider-info">
            <span class="control-title">⏱️ Feux</span>
            <div class="time-display badge fire-badge" id="time-display">--/--/-- --:--</div>
          </div>
          <input type="range" id="time-slider" class="slider" min="0" max="0" value="0" />
        </div>
      </div>
    </div>

  </div>

  <!-- MapLibre GL JS & App -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>

</html>
