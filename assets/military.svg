<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28">
  <!-- Ombre portée -->
  <path d="M12 23 L2 10 L7 10 L5 3 L12 6 L19 3 L17 10 L22 10 Z" fill="#000000" opacity="0.25" transform="translate(0, 1)"/>

  <!-- AILES & FUSELAGE D'AVION (Vert Kaki Militaire) -->
  <path d="M12 23 L2 10 L7 10 L5 3 L12 6 L19 3 L17 10 L22 10 Z" fill="#4b5320" stroke="#252b12" stroke-width="1" stroke-linejoin="round"/>

  <!-- DÉTAILS CAMOUFLAGE / STRUCTURE (Vert sombre) -->
  <path d="M12 6 L7 10 L12 12 L17 10 Z" fill="#323816"/>
  <line x1="12" y1="6" x2="12" y2="22" stroke="#252b12" stroke-width="0.8"/>

  <!-- PALES D'HÉLICOPTÈRE (Rotor central à 4 pales) -->
  <g stroke="#c2b280" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
    <line x1="4" y1="11" x2="20" y2="11"/> <!-- Pale horizontale -->
    <line x1="12" y1="3" x2="12" y2="19"/> <!-- Pale verticale -->
  </g>
  <!-- Moyeu du rotor (Centre) -->
  <circle cx="12" cy="11" r="1.8" fill="#1f240e" stroke="#c2b280" stroke-width="0.8"/>

  <!-- COCKPIT / VERRIÈRE (Dorée / Ambre tactique) -->
  <path d="M10.8 14 C11 16 11.5 17.5 12 17.5 C12.5 17.5 13 16 13.2 14 Z" fill="#d97706" opacity="0.85"/>

  <!-- COCARDE FRANÇAISE (Pointe du nez, vers le bas) -->
  <circle cx="12" cy="20.5" r="1.8" fill="#ed2939"/>
  <circle cx="12" cy="20.5" r="1.2" fill="#ffffff"/>
  <circle cx="12" cy="20.5" r="0.6" fill="#002654"/>
</svg>
