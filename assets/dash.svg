<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Ombre portée pour la carte -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Dégradés Sécurité Civile -->
    <linearGradient id="fuselageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <linearGradient id="redDashGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Traînée de retardant (produit ignifugeant rouge) -->
    <path d="M50,85 C40,75 35,62 50,52 C65,62 60,75 50,85 Z" fill="#E53935" opacity="0.75"/>
    <circle cx="44" cy="78" r="3.5" fill="#EF5350" opacity="0.85"/>
    <circle cx="54" cy="87" r="2.8" fill="#E57373" opacity="0.8"/>
    <circle cx="49" cy="93" r="1.8" fill="#FFCDD2" opacity="0.8"/>

    <!-- Empennage en T -->
    <path d="M26,14 L74,14 L71,20 L29,20 Z" fill="url(#redDashGradient)"/>
    <path d="M26,14 L74,14 L73,16 L27,16 Z" fill="#9A0007"/>
    <path d="M47,14 L53,14 L55,28 L45,28 Z" fill="url(#fuselageGradient)"/>

    <!-- Fuselage long Dash 8-Q400 -->
    <path d="M46,18 C46,18 44,42 44,64 C44,72 47,78 50,78 C53,78 56,72 56,64 C56,42 54,18 54,18 Z" fill="url(#fuselageGradient)"/>

    <!-- Bande rouge Sécurité Civile -->
    <path d="M44.5,22 L55.5,22 L55.2,32 L44.8,32 Z" fill="url(#redDashGradient)"/>

    <!-- Cockpit -->
    <path d="M46.5,42 L53.5,42 L52.5,49 L47.5,49 Z" fill="#1A252C"/>
    <path d="M47.5,43 L52.5,43 L52,46.5 L48,46.5 Z" fill="#64B5F6" opacity="0.85"/>

    <!-- Ailes hautes -->
    <path d="M45,46 L3,48 L4,55 L45,54 Z" fill="url(#fuselageGradient)"/>
    <path d="M55,46 L97,48 L96,55 L55,54 Z" fill="url(#fuselageGradient)"/>

    <!-- Bout d'ailes rouges -->
    <path d="M3,48 L12,48.4 L12.5,54.8 L4,55 Z" fill="url(#redDashGradient)"/>
    <path d="M97,48 L88,48.4 L87.5,54.8 L96,55 Z" fill="url(#redDashGradient)"/>

    <!-- Nacelles moteurs PW150A -->
    <path d="M22,43 L28,43 L29,58 L21,58 Z" fill="#37474F"/>
    <path d="M22.5,58 L27.5,58 L26.5,61 L23.5,61 Z" fill="#212121"/>
    <ellipse cx="25" cy="61" rx="9" ry="2" fill="#FFFFFF" opacity="0.6" stroke="#666" stroke-width="0.5" stroke-dasharray="2,1"/>

    <path d="M72,43 L78,43 L79,58 L71,58 Z" fill="#37474F"/>
    <path d="M72.5,58 L77.5,58 L76.5,61 L73.5,61 Z" fill="#212121"/>
    <ellipse cx="75" cy="61" rx="9" ry="2" fill="#FFFFFF" opacity="0.6" stroke="#666" stroke-width="0.5" stroke-dasharray="2,1"/>

    <!-- Nez -->
    <path d="M46,74 C46,77 48,80 50,80 C52,80 54,77 54,74 Z" fill="#E53935"/>
    <path d="M47.5,77 C47.5,79 48.5,80.5 50,80.5 C51.5,80.5 52.5,79 52.5,77 Z" fill="#212121"/>
  </g>
</svg>
