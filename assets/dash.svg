<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Ailes principales -->
    <path d="M 20 100 L 90 92 L 100 93 L 110 92 L 180 100 L 180 108 L 110 103 L 100 103 L 90 103 L 20 108 Z" fill="#d0d4d9" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
    
