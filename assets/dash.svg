    <!-- Nacelles turbopropulseurs -->
    <rect x="58" y="80" width="12" height="35" rx="3" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
    <rect x="130" y="80" width="12" height="35" rx="3" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
    
    <!-- Hélices -->
    <ellipse cx="64" cy="115" rx="14" ry="2" fill="#111827"/>
    <ellipse cx="136" cy="115" rx="14" ry="2" fill="#111827"/>

