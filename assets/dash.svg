    <path d="M 100 25 C 93 25, 91 40, 91 60 L 91 145 C 91 165, 95 180, 100 180 C 105 180, 109 165, 109 145 L 109 60 C 109 40, 107 25, 100 25 Z" fill="#fbf9f0" stroke="#1f2937" stroke-width="2"/>

