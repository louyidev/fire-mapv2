    <path d="M 20 100 L 32 101 L 32 107 L 20 108 Z" fill="#cc0000"/>
    <path d="M 180 100 L 168 101 L 168 107 L 180 108 Z" fill="#cc0000"/>

    <!-- Empennage arrière en T -->
