    <path d="M 109 55 C 109 90, 109 135, 106 165 L 109 155 Z" fill="#cc0000"/>
    <path d="M 91 75 Q 89 120 95 168 L 100 178 L 105 168 Q 111 120 109 75 L 109 90 Q 106 130 100 155 Q 94 130 91 90 Z" fill="#cc0000"/>
    <path d="M 92 90 Q 94 125 100 150 Q 106 125 108 90 L 107 98 Q 105 128 100 144 Q 95 128 93 98 Z" fill="#ffcc00"/>

    <!-- Cockpit -->
    <path d="M 95 166 Q 100 172 105 166 L 104 162 Q 100 164 96 162 Z" fill="#1f2937"/>

    <!-- Numéro 75 sur la queue -->
    <text x="100" y="48" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#cc0000" text-anchor="middle">75</text>
  </g>
</svg>
