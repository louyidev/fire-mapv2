<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Ombre portée pour lisibilité sur carte Leaflet -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Dégradé pour le fuselage principal -->
    <linearGradient id="fuselageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>

    <!-- Dégradé pour la verrière / cockpit -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81D4FA"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>

    <!-- Dégradé pour la poutre de queue -->
    <linearGradient id="tailGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Disque de rotation du rotor principal -->
    <circle cx="50" cy="50" r="42" fill="#CFD8DC" opacity="0.15"/>
    <circle cx="50" cy="50" r="42" stroke="#B0BEC5" stroke-width="0.75" stroke-dasharray="2,3" fill="none" opacity="0.4"/>

    <!-- Pales du rotor principal -->
    <line x1="50" y1="8" x2="50" y2="92" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Lignes de finition pales -->
    <line x1="50" y1="8" x2="50" y2="92" stroke="#ECEFF1" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="8" y1="50" x2="92" y2="50" stroke="#ECEFF1" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>

    <!-- Poutre de queue -->
    <path d="M47,15 L53,15 L51.5,45 L48.5,45 Z" fill="url(#tailGradient)"/>

    <!-- Stabilisateur arrière -->
    <path d="M38,15 L62,15 L60,18 L40,18 Z" fill="#455A64"/>

    <!-- Rotor de queue -->
    <line x1="42" y1="11" x2="58" y2="11" stroke="#263238" stroke-width="1.8"/>
    <circle cx="50" cy="11" r="7" fill="#CFD8DC" opacity="0.25"/>

    <!-- Patins d'atterrissage -->
    <!-- Patin gauche -->
    <path d="M36,32 L36,70 C36,73 34,75 32,75" stroke="#102A43" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="36" y1="48" x2="42" y2="48" stroke="#102A43" stroke-width="1.8"/>
    <line x1="36" y1="62" x2="43" y2="62" stroke="#102A43" stroke-width="1.8"/>

    <!-- Patin droit -->
    <path d="M64,32 L64,70 C64,73 66,75 68,75" stroke="#102A43" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="64" y1="48" x2="58" y2="48" stroke="#102A43" stroke-width="1.8"/>
    <line x1="64" y1="62" x2="57" y2="62" stroke="#102A43" stroke-width="1.8"/>

    <!-- Fuselage principal -->
    <path d="M42,42 C40,50 40,65 42,75 C44,83 47,86 50,86 C53,86 56,83 58,75 C60,65 60,50 58,42 C55,38 45,38 42,42 Z" fill="url(#fuselageGradient)"/>

    <!-- Prises d'air turbine -->
    <rect x="45" y="42" width="10" height="12" rx="2" fill="#78909C"/>
    <rect x="46.5" y="44" width="7" height="4" rx="1" fill="#102A43"/>

    <!-- Verrière du cockpit -->
    <path d="M43,62 C43,58 57,58 57,62 C57,74 55,83 50,83 C45,83 43,74 43,62 Z" fill="url(#glassGradient)" opacity="0.85"/>

    <!-- Montants verrière -->
    <path d="M50,60 L50,83" stroke="#263238" stroke-width="1.2"/>
    <path d="M43.5,68 L56.5,68" stroke="#263238" stroke-width="1"/>

    <!-- Tête de rotor -->
    <circle cx="50" cy="50" r="4.5" fill="#37474F"/>
    <circle cx="50" cy="50" r="2.5" fill="#CFD8DC"/>
    <circle cx="50" cy="50" r="1" fill="#263238"/>
  </g>
</svg>
