<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ombre sous l'appareil pour donner du relief -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Groupe principal orienté vers le bas (nez vers le bas) -->
  <g filter="url(#shadow)">
    <!-- 1. PALS DU ROTOR PRINCIPAL (En arrière-plan) -->
    <ellipse cx="250" cy="200" rx="190" ry="190" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>
    <line x1="60" y1="200" x2="440" y2="200" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <line x1="250" y1="10" x2="250" y2="390" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <!-- Tête de rotor -->
    <circle cx="250" cy="200" r="10" fill="#333333"/>
    <circle cx="250" cy="200" r="4" fill="#666666"/>

    <!-- 2. POUTRE DE QUEUE ET DERIVE (Pointe vers le haut) -->
    <!-- Structure de la queue -->
    <path d="M 240,190 L 244,60 L 256,60 L 260,190 Z" fill="#fbd000"/>
    <!-- Stabilisateurs horizontaux (Ailerons) -->
    <path d="M 215,95 L 285,95 L 280,105 L 220,105 Z" fill="#cc0000"/>
    <!-- Poutre arrière & dérive -->
    <path d="M 243,60 L 243,30 L 257,30 L 257,60 Z" fill="#fbd000"/>
    <!-- Bande rouge Sécurité Civile sur la queue -->
    <path d="M 243,55 L 257,55 L 257,40 L 243,40 Z" fill="#cc0000"/>
    <!-- Rotor de queue -->
    <rect x="257" y="32" width="18" height="4" fill="#111111" rx="1"/>
    <circle cx="257" cy="34" r="3" fill="#444444"/>

    <!-- 3. PATINS D'ATTERRISSAGE -->
    <rect x="195" y="140" width="8" height="150" rx="3" fill="#333333"/>
    <rect x="297" y="140" width="8" height="150" rx="3" fill="#333333"/>
    <!-- Barres de liaison patins-fuselage -->
    <line x1="203" y1="170" x2="235" y2="170" stroke="#222222" stroke-width="4"/>
    <line x1="297" y1="170" x2="265" y2="170" stroke="#222222" stroke-width="4"/>
    <line x1="203" y1="260" x2="235" y2="260" stroke="#222222" stroke-width="4"/>
    <line x1="297" y1="260" x2="265" y2="260" stroke="#222222" stroke-width="4"/>

    <!-- 4. FUSELAGE PRINCIPAL (Vue du dessus, nez pointant vers le bas) -->
    <!-- Forme aérodynamique globale -->
    <path d="M 250,335 C 210,315 210,240 220,180 L 280,180 C 290,240 290,315 250,335 Z" fill="#fbd000"/>
    
    <!-- Bandes latérales rouges emblématiques (Gironde / Sécurité Civile) -->
    <path d="M 221,270 C 218,240 220,200 223,180 L 232,180 C 229,200 228,240 229,270 Z" fill="#cc0000"/>
    <path d="M 279,270 C 282,240 280,200 277,180 L 268,180 C 271,200 272,240 271,270 Z" fill="#cc0000"/>

    <!-- 5. VERRIÈRE ET COCKPIT (Orientés vers le bas) -->
    <!-- Pare-brise principal avant -->
    <path d="M 250,325 C 225,310 225,280 230,265 L 270,265 C 275,280 275,310 250,325 Z" fill="#1e293b"/>
    <!-- Vitres de toit / portières -->
    <path d="M 228,260 L 232,220 L 246,220 L 245,260 Z" fill="#1e293b"/>
    <path d="M 272,260 L 268,220 L 254,220 L 255,260 Z" fill="#1e293b"/>
    <!-- Reflets sur le pare-brise -->
    <path d="M 240,315 C 232,305 232,290 235,275" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

    <!-- 6. MARQUAGE SAMU & CROIX DE VIE -->
    <!-- Croix de vie du SAMU (Fond blanc + Croix bleue) -->
    <g transform="translate(250, 205) scale(0.65)">
      <circle cx="0" cy="0" r="16" fill="#ffffff"/>
      <!-- Croix à 6 branches -->
      <path d="M -3,-12 L 3,-12 L 3,-3 L 11,-8 L 14,-3 L 6,2 L 14,7 L 11,12 L 3,7 L 3,16 L -3,16 L -3,7 L -11,12 L -14,7 L -6,2 L -14,-3 L -11,-8 L -3,-3 Z" fill="#0055a5"/>
    </g>

    <!-- Inscription SAMU uniquement -->
    <text x="250" y="240" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#0055a5" text-anchor="middle" letter-spacing="1">SAMU</text>
  </g>
</svg>
